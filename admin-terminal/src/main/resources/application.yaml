spring:
  application:
    name: admin-terminal
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/inteligence_city_monitor_sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
server:
  port: ${SERVER_PORT:8007}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
